[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "zesco"
version = "1.0"
description = "ZeSCO: A Zero-Shot method for Cross-view Orientation"
authors = [
    "Leonardo Russo <leonardo.russo@inria.fr>",
    "Diego Marcos <diego.marcos@inria.fr>"
]
readme = "README.md"
repository = "https://github.com/Leonardo-Russo/ZeSCO"

[tool.poetry.dependencies]
python = "3.12"
